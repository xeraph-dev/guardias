<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Guardias" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14294a"/>
      <stop offset="1" stop-color="#0a1424"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="96" y="112" width="320" height="304" rx="36"/>
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Tarjeta del calendario -->
  <rect x="96" y="112" width="320" height="304" rx="36" fill="#183457"/>
  <g clip-path="url(#card-clip)">
    <rect x="96" y="112" width="320" height="72" fill="#22d3ee"/>
  </g>

  <!-- Anillas -->
  <rect x="160" y="88" width="20" height="56" rx="10" fill="#f4f7fb"/>
  <rect x="332" y="88" width="20" height="56" rx="10" fill="#f4f7fb"/>

  <!-- Cuadrícula de días -->
  <g fill="#2c5080">
    <rect x="128" y="216" width="40" height="40" rx="10"/>
    <rect x="200" y="216" width="40" height="40" rx="10"/>
    <rect x="272" y="216" width="40" height="40" rx="10"/>
    <rect x="344" y="216" width="40" height="40" rx="10"/>

    <rect x="128" y="280" width="40" height="40" rx="10"/>
    <rect x="200" y="280" width="40" height="40" rx="10"/>
    <rect x="344" y="280" width="40" height="40" rx="10"/>

    <rect x="128" y="344" width="40" height="40" rx="10"/>
    <rect x="200" y="344" width="40" height="40" rx="10"/>
    <rect x="272" y="344" width="40" height="40" rx="10"/>
    <rect x="344" y="344" width="40" height="40" rx="10"/>
  </g>

  <!-- Día de guardia: celda naranja con punto -->
  <rect x="272" y="280" width="40" height="40" rx="10" fill="#fb923c"/>
  <circle cx="292" cy="300" r="8" fill="#0a1424"/>
</svg>
